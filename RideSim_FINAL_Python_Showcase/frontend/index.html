<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RideSim</title><style>
body{margin:0;background:#11151b;color:#edf2f7;font:14px monospace}header,.controls{padding:20px 28px;border-bottom:1px solid #303945}.status{float:right;color:#24c7b5}.controls{display:flex;gap:10px;flex-wrap:wrap}button,input{background:#202731;color:#fff;border:1px solid #38414d;padding:9px;border-radius:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px 28px}.card{background:#1a2028;border:1px solid #303945;border-radius:9px;padding:15px}canvas{width:100%;height:390px;background:#171c23}.gold{color:#ffb21a}.teal{color:#24c7b5}.metric{padding-top:12px;border-top:1px solid #303945}.big{font-size:28px;font-weight:bold}table{margin:0 28px 28px;width:calc(100% - 56px);border-collapse:collapse;background:#1a2028}td,th{padding:10px;border-bottom:1px solid #303945;text-align:right}td:first-child,th:first-child{text-align:left}@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><b style="font-size:24px">RIDESIM</b><span class="status">● SYSTEM ONLINE</span><div>Driver–Rider Matching Engine · Phase 1</div></header>
<div class="controls">Fleet <input id="n" value="6" type="number" min="2" max="100"> Seed <input id="s" value="7" type="number"><button onclick="match()">Match</button><button onclick="document.getElementById('s').value++;match()">New Scenario</button><button onclick="document.getElementById('n').value=30;match()">Jackpot ×30</button><span id="msg"></span></div>
<div class="grid"><section class="card"><h2 class="gold">GREEDY <small>nearest-neighbour · O(n²)</small></h2><canvas id="g"></canvas><div class="metric">TOTAL DISTANCE <b id="gd" class="big gold">—</b> km</div></section>
<section class="card"><h2 class="teal">OPTIMAL <small>Kuhn–Munkres · O(n³)</small></h2><canvas id="o"></canvas><div class="metric">TOTAL DISTANCE <b id="od" class="big teal">—</b> km</div></section></div>
<table><tr><th>Metric</th><th>Greedy</th><th>Optimal</th><th>Difference</th></tr><tr><td>Pickup distance</td><td id="a">—</td><td id="b">—</td><td id="c">—</td></tr><tr><td>Runtime</td><td id="d">—</td><td id="e">—</td><td id="f">—</td></tr></table>
<script>
async function match(){let n=+document.getElementById('n').value,s=+document.getElementById('s').value;let x=await (await fetch(`/api/match?n=${n}&seed=${s}`)).json();gd.textContent=x.greedy.total_distance.toFixed(2);od.textContent=x.optimal.total_distance.toFixed(2);a.textContent=x.greedy.total_distance.toFixed(2)+' km';b.textContent=x.optimal.total_distance.toFixed(2)+' km';c.textContent=x.distance_saved.toFixed(2)+' km ('+x.distance_saved_pct.toFixed(1)+'%)';d.textContent=x.greedy.runtime_ms.toFixed(3)+' ms';e.textContent=x.optimal.runtime_ms.toFixed(3)+' ms';f.textContent=(x.greedy.runtime_ms/x.optimal.runtime_ms).toFixed(2)+'×';draw('g',x.greedy.matches,'#ffb21a',x);draw('o',x.optimal.matches,'#24c7b5',x)}
function draw(id,matches,col,x){let c=document.getElementById(id),z=devicePixelRatio,w=c.clientWidth,h=c.clientHeight;c.width=w*z;c.height=h*z;let q=c.getContext('2d');q.scale(z,z);let sx=v=>30+v/100*(w-60),sy=v=>h-30-v/100*(h-60);q.strokeStyle='#ffb21a';q.globalAlpha=.15;for(let i=0;i<=10;i++){q.beginPath();q.moveTo(sx(i*10),30);q.lineTo(sx(i*10),h-30);q.stroke();q.beginPath();q.moveTo(30,sy(i*10));q.lineTo(w-30,sy(i*10));q.stroke()}q.globalAlpha=1;q.setLineDash([7,6]);q.strokeStyle=col;q.lineWidth=3;matches.forEach(m=>{let a=x.drivers[m.driver_index],b=x.riders[m.rider_index];q.beginPath();q.moveTo(sx(a.x),sy(a.y));q.lineTo(sx(b.x),sy(b.y));q.stroke()});q.setLineDash([]);x.drivers.forEach(p=>{q.fillStyle='#fff';q.beginPath();q.arc(sx(p.x),sy(p.y),5,0,7);q.fill();q.fillStyle='#9aa4b2';q.fillText(p.id,sx(p.x)-8,sy(p.y)+18)});x.riders.forEach(p=>{q.fillStyle=col;q.beginPath();q.arc(sx(p.x),sy(p.y),5,0,7);q.fill();q.fillStyle='#9aa4b2';q.fillText(p.id,sx(p.x)-8,sy(p.y)-9)})}
match();
</script></body></html>
